<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Operation in JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header my-5 text-center">
        <h1>Product Management System</h1>
    </div>

    <div class="addProductSec d-flex justify-content-between mb-3">
        <input type="text" id="searchInput" placeholder="Search for products" class="form-control w-50" onkeyup="searchProduct()">
        <button class="btn btn-danger" onclick="clearList()">Delete All</button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productAdd" onclick="resetForm()">Add Product</button>
    </div>

    <div class="table-responsive">
        <table id="displayTable" class="table table-striped">
            <thead>
                <tr>
                    <th>Id </th>
                    <th>Name <button class="btn btn-sm btn-outline-secondary" onclick="sortTable('name')">↕</button></th>
                    <th>Description</th>
                    <th>Price <button class="btn btn-sm btn-outline-secondary" onclick="sortTable('price')">↕</button></th>
                    <th>Image</th>
                    <th></th>
                </tr>
            </thead>
            
            <tbody></tbody>
        </table>
    </div>
</div>
<div class="modal fade" id="productAdd" tabindex="-1" aria-labelledby="productAddLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productAddLabel">Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="editIndex"> 
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control" id="productPrice" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Select Image</label>
                        <input type="file" class="form-control" id="productImage" accept="image/*">
                        <img id="previewImage" src="" alt="" width="100" class="mt-2 d-none">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-success" id="saveProductButton">Add Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
